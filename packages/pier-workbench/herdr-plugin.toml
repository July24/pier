# pier-workbench: blocked notification + M23 focus heat layout + sidebar agent view + ops dashboard.
#
# ⚠️ Herdr plugin v1 has no SDK / no runtime UI: "the entire herdr CLI is the plugin API".
# This manifest declares entries only; logic is implemented with Node under scripts/.
#
# Cross-platform convention: command cwd = plugin root directory (guaranteed by herdr).
# POSIX entries invoke node directly via relative path;
# Windows entries retain powershell.exe wrapper — HERDR_PLUGIN_ROOT has been empirically observed
# to include a \\?\ prefix, which cannot be resolved when directly concatenated into node argv and must
# be stripped first (v1.1 Windows empirical finding; do not revert).
# The two platform entries for the same hook are logically equivalent; editing one requires syncing the other.

id = "pier.workbench"
name = "pier-workbench"
version = "0.1.0"
description = "pier × herdr 工作台融合：blocked 通知、焦点热力布局、运维面板与侧边栏视图"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos", "windows"]

# ── Event hook: subagent blocked -> notification (human decision gate; M4) ──
[[events]]
on = "pane.agent_status_changed"
platforms = ["linux", "macos"]
command = ["node", "scripts/notify-agent-state.mjs"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/notify-agent-state.mjs')"]

# ── Event hook: register Pier sidebar agent view (0.9.0) ─────────────
[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["node", "scripts/agent-view.mjs"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/agent-view.mjs')"]

[[events]]
on = "pane.created"
platforms = ["linux", "macos"]
command = ["node", "scripts/agent-view.mjs"]

[[events]]
on = "pane.created"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/agent-view.mjs')"]

# ── M23 Tier 1: expand focused pane to primary window on human focus (D67) ──
# pane.created records pane age only, providing the 3s whitelist for F1 when cause is missing.
[[events]]
on = "pane.created"
platforms = ["linux", "macos"]
command = ["node", "scripts/heat-reflow.mjs"]

[[events]]
on = "pane.created"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/heat-reflow.mjs')"]

[[events]]
on = "pane.focused"
platforms = ["linux", "macos"]
command = ["node", "scripts/heat-reflow.mjs"]

[[events]]
on = "pane.focused"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/heat-reflow.mjs')"]

# ── M23 Tier 2 (D90-F semantic bridge): agent status change -> secondary window tiered reflow ──
# Immediate promotion/demotion on blocked appear/disappear (event-driven, not polled; D3 compliant).
[[events]]
on = "pane.agent_status_changed"
platforms = ["linux", "macos"]
command = ["node", "scripts/heat-reflow.mjs"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/heat-reflow.mjs')"]

# ── D95 (V25): pane recycling (subagent completed and GC'd) -> count reflow ──
# pane.closed event payload only contains {pane_id, workspace_id} (no tab_id) — parent tab is
# looked up via the pane->tab mapping recorded by onCreated (reflow.ts onCountChanged).
[[events]]
on = "pane.closed"
platforms = ["linux", "macos"]
command = ["node", "scripts/heat-reflow.mjs"]

[[events]]
on = "pane.closed"
platforms = ["windows"]
command = ["powershell.exe", "-Command", "$r = $env:HERDR_PLUGIN_ROOT; if ($r.Length -gt 4 -and $r[0] -eq [char]92 -and $r[1] -eq [char]92) { $r = $r.Substring(4) }; & node ($r + '/scripts/heat-reflow.mjs')"]

# ── Plugin Panes: Pier Ops Dashboard (0.9.0) ────────────────────────
# One entry only: a pane id is the entrypoint used by `herdr plugin pane open --entrypoint dashboard`,
# and herdr rejects a manifest that declares the same id twice (verified live: "duplicate pane id").
# Unlike the event hooks above, this command needs no HERDR_PLUGIN_ROOT rewriting — the dashboard
# reads HERDR_SOCKET_PATH from the environment and resolves everything else from cwd (plugin root).
# [[panes]] entries are definitions, not autostart: the pane opens only on demand.
[[panes]]
id = "dashboard"
title = "Pier Dashboard"
placement = "tab"
platforms = ["linux", "macos", "windows"]
command = ["node", "scripts/dashboard.mjs"]


